<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayStation 3 XMB Recreation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="wave-canvas"></canvas>
  <p class="disclaimer">Unofficial fan project, not affiliated with or endorsed by Sony Interactive Entertainment. "PlayStation" and "XMB" are trademarks of Sony Interactive Entertainment Inc.</p>

  <script src="background-gradients-night.js"></script>
  <script src="background-gradients-day.js"></script>
  <script src="background-months.js"></script>
  <script src="spline-settings.js"></script>
  <script src="scene-themes.js"></script>
  <script src="particles-settings.js"></script>
  <script src="settings-panels.js"></script>
  <script src="wave-reverse.js"></script>
  <script src="particles-reverse.js"></script>
  <script src="xmb-input.js"></script>
  <script src="backdrop.js"></script>
  <script src="postprocess.js"></script>
  <script src="spline.js"></script>
  <script src="particles.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('wave-canvas');
      const gl = canvas.getContext('webgl2', {
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
      });

      if (!gl) {
        document.body.textContent = 'WebGL 2 required';
        return;
      }

      gl.getExtension('OES_texture_float_linear');
      gl.getExtension('EXT_color_buffer_float');

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        gl.viewport(0, 0, canvas.width, canvas.height);
      }

      window.addEventListener('resize', resize);
      resize();

      const HIDE_TITLE = 'Hide this panel - Press H to toggle GUI visibility';

      // One panel for both settings objects, in tabs: the particles' object holds the scene's state, the input and
      // PARTICLES.mnu, the wave's the backdrop, the wave and the passes after it. What the theme and the sequences
      // write into either can, once changed by hand, be locked against them.
      const settingsPanel = window.createSettingsPanel({
        id: 'settings-panel',
        title: 'Settings',
        position: { top: '12px', right: '12px' },
        showPosition: { top: '12px', right: '12px' },
        hideTitle: HIDE_TITLE,
        tabs: ['Scene', 'Input', 'Backdrop', 'Wave', 'Post', 'Particles'],
        sources: {
          particles: {
            settings: window.PARTICLE_SETTINGS,
            meta: window.PARTICLE_SETTINGS_META,
            layout: window.PARTICLE_SETTINGS_LAYOUT,
            lockable: window.PARTICLE_THEME_KEYS,
            defaultTab: 'Particles',
          },
          wave: {
            settings: window.SPLINE_SETTINGS,
            meta: window.SPLINE_SETTINGS_META,
            layout: window.SPLINE_SETTINGS_LAYOUT,
            lockable: window.WAVE_THEME_KEYS,
            defaultTab: 'Wave',
          },
        },
      });

      // The controls and the notice can be put away, for the scene alone - in a frame or as a wallpaper: H toggles
      // them, unless it is typed into a control or comes with a modifier (Ctrl+H is the browser's), and ?ui=off starts
      // the page without them. The panel comes back as it was left, open or hidden behind its Show button.
      if (new URLSearchParams(window.location.search).get('ui') === 'off') document.body.classList.add('ui-off');
      window.addEventListener('keydown', function (e) {
        if (e.key !== 'h' && e.key !== 'H') return;
        if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
        if (e.target && e.target.closest && e.target.closest('input, select, textarea')) return;
        document.body.classList.toggle('ui-off');
      });

      // The page opens as the console does, with the XMB's start. It is set after the panel is made, so the setting's
      // default stays None: the first sync plays it, and the panel marks it as the sequence's until it hands over.
      window.PARTICLE_SETTINGS.sequence = 'coldboot';

      // The theme writes the firmware's own parameter sets into the particles' and the wave's settings; on 'auto' it
      // keeps up with the clock. The particles' settings hold the scene's state it follows, and it leaves alone what is
      // locked in the panel.
      function syncThemes() {
        const scene = window.PARTICLE_SETTINGS;
        const writers = window.applySceneThemes(scene, {
          particles: { settings: scene, keep: settingsPanel ? settingsPanel.locked.particles : null },
          wave: { settings: window.SPLINE_SETTINGS, keep: settingsPanel ? settingsPanel.locked.wave : null },
        });
        // It names who wrote - the theme, the music or a sequence - and the panel colours them apart.
        if (writers.particles && settingsPanel) settingsPanel.refresh('particles', writers.particles);
        if (writers.wave && settingsPanel) settingsPanel.refresh('wave', writers.wave);
      }

      syncThemes();

      const splineLayer = window.createSplineLayer(gl, canvas);
      const input = window.createXmbInput(canvas, window.PARTICLE_SETTINGS);
      const particlesLayer = window.createParticlesLayer(gl, canvas, { surface: splineLayer.surface, input });

      let prevFrameMs = performance.now();
      let splineTimeSec = 0;

      function frame(nowMs) {
        const dtSec = Math.max(0, (nowMs - prevFrameMs) / 1000);
        prevFrameMs = nowMs;

        splineTimeSec += dtSec;

        syncThemes();
        // The backdrop is handed the moment the scene's clock shows, on each of its ticks - which Theme Settings'
        // Colour can stop, and the XMB's start, a content's boot and the music hold - and the wave starts its lines
        // afresh as the XMB's start begins. The scene's fade, Theme Settings' Brightness or the background given away,
        // goes to both layers at once, as the console's does, and so does _Gamma, which the video output sets.
        const scene = window.PARTICLE_SETTINGS;
        const fade = window.xmbSceneFade(scene);
        const gamma = window.xmbSceneGamma(scene);
        splineLayer.render(splineTimeSec, window.xmbBackdropMoment(scene), scene.sequence, fade, gamma);
        // The particles are emitted from the wave just drawn, so they share its clock.
        particlesLayer.render(splineTimeSec, dtSec, fade, gamma);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
