# Builds a Nagare release: the exes optimised with the PGO profile kept in native/pgo/ (recorded on a PC with
# `.\pgo.ps1 -Save`, since the training draws the scene and wants a GPU), packaged by Inno Setup, and - once SignPath
# is set up (below) - code-signed, the exes before they are packaged and the installer after. A tag v* makes a draft
# GitHub release of it; run by hand, it leaves the files as the run's artifact.
#
# Signing, through the SignPath Foundation's free certificate for open-source projects, runs when the repository's
# variable SIGNPATH_ORGANIZATION_ID is set (Settings > Secrets and variables > Actions > Variables), with the secret
# SIGNPATH_API_TOKEN and the variables SIGNPATH_PROJECT_SLUG and SIGNPATH_POLICY_SLUG; without them the files are
# left unsigned.
name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh
    working-directory: native

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup install
          rustup show active-toolchain

      - name: Version
        id: version
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "the tag $env:GITHUB_REF_NAME does not match Cargo.toml's version $v"
          }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Fat LTO over one codegen unit, optimised with the kept profile; no training here.
      - name: Build (PGO)
        run: .\pgo.ps1 -Use

      - name: Stage the exes
        run: |
          New-Item -ItemType Directory -Force target\stage | Out-Null
          Copy-Item target\release\nagare.exe, target\release\nagare-watchdog.exe target\stage

      # Signing, round one: the exes the installer packages.
      - name: Upload the exes for signing
        if: env.SIGN == 'true'
        id: exes
        uses: actions/upload-artifact@v7
        with:
          name: exes-unsigned
          path: native/target/stage/*.exe
      - name: Sign the exes
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.exes.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: native/target/signed
      - name: Take the signed exes
        if: env.SIGN == 'true'
        run: Copy-Item target\signed\*.exe target\release -Force

      - name: Package
        run: .\installer.ps1 -NoBuild

      # Signing, round two: the installer.
      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: setup
        uses: actions/upload-artifact@v7
        with:
          name: setup-unsigned
          path: native/target/installer/nagare-setup-${{ steps.version.outputs.value }}.exe
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: native/target/signed-setup
      - name: Take the signed installer
        if: env.SIGN == 'true'
        run: Copy-Item target\signed-setup\*.exe target\installer -Force

      # The installer, and the two exes zipped for those who would rather not install.
      - name: Collect
        run: |
          $v = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory -Force target\out | Out-Null
          Copy-Item "target\installer\nagare-setup-$v.exe" target\out
          Compress-Archive -Path target\release\nagare.exe, target\release\nagare-watchdog.exe -DestinationPath "target\out\nagare-portable-$v.zip" -Force
          $sums = Get-ChildItem target\out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName).Hash.ToLower(), $_.Name }
          $sums | Set-Content target\out\SHA256SUMS.txt -Encoding ascii
          $sums

      - uses: actions/upload-artifact@v7
        with:
          name: nagare-${{ steps.version.outputs.value }}
          path: native/target/out/*
          if-no-files-found: error

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $signed = if ($env:SIGN -eq 'true') { 'signed' } else { 'not code-signed yet' }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem target\out).FullName --draft --title "Nagare $v" --generate-notes --notes "Built with PGO; $signed."
