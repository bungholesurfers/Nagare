# Builds a Nagare release: the exes optimised with the PGO profile kept in native/pgo/ (recorded on a PC with
# `cargo xtask pgo`, since the training draws the scene and wants a GPU), packaged by Inno Setup. A tag v* makes a
# draft GitHub release of it; run by hand, it leaves the files as the run's artifact. The files are not code-signed
# (Windows' Authenticode); Software Update's own signature is the manifest's, below.
name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh
    working-directory: native

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup install
          rustup show active-toolchain

      - name: Version
        id: version
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "the tag $env:GITHUB_REF_NAME does not match Cargo.toml's version $v"
          }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Fat LTO over one codegen unit, optimised with the kept profile; no training here.
      - name: Build (PGO)
        run: cargo xtask pgo-build

      - name: Package
        run: cargo xtask installer --no-build

      # The installer, the two exes zipped for those who would rather not install, and Software Update's manifest of
      # the installer, signed with the release key (src/signing.rs). Without the secret NAGARE_UPDATE_KEY the release
      # has no manifest, and no copy of Nagare updates to it by itself.
      - name: Collect
        env:
          NAGARE_UPDATE_KEY: ${{ secrets.NAGARE_UPDATE_KEY }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory -Force target\out | Out-Null
          Copy-Item "target\installer\nagare-setup-$v.exe" target\out
          Compress-Archive -Path target\release\nagare.exe, target\release\nagare-watchdog.exe -DestinationPath "target\out\nagare-portable-$v.zip" -Force
          if ($env:NAGARE_UPDATE_KEY) {
            .\target\release\nagare-release.exe manifest "target\out\nagare-setup-$v.exe" $v target\out
            if ($LASTEXITCODE -ne 0) { throw 'the update manifest failed' }
          } else {
            Write-Warning 'NAGARE_UPDATE_KEY is not set: this release has no update manifest, so nothing updates to it by itself'
          }
          $sums = Get-ChildItem target\out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName).Hash.ToLower(), $_.Name }
          $sums | Set-Content target\out\SHA256SUMS.txt -Encoding ascii
          $sums

      - uses: actions/upload-artifact@v7
        with:
          name: nagare-${{ steps.version.outputs.value }}
          path: native/target/out/*
          if-no-files-found: error

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # The body is .github/release-notes.md, its placeholders filled in - the download links up top - with GitHub's
        # generated list of changes after it.
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $signed = 'Not code-signed yet: SmartScreen may warn about the download. Choose More info > Run anyway.'
          $notes = (Get-Content ..\.github\release-notes.md -Raw).Replace('{{REPO}}', $env:GITHUB_REPOSITORY).Replace('{{TAG}}', $env:GITHUB_REF_NAME).Replace('{{VERSION}}', $v).Replace('{{SIGNED}}', $signed)
          $notes | Set-Content target\release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem target\out).FullName --draft --title "Nagare $v" --notes-file target\release-notes.md --generate-notes
