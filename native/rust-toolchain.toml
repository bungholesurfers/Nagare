# The compiler Nagare is built with, here and in the GitHub workflows. A PGO profile (pgo\nagare.profdata) only fits
# the compiler that recorded it, so a change here wants .\pgo.ps1 -Save run again with the new one.
[toolchain]
channel = "1.99.1"
components = ["clippy", "llvm-tools"]
# The other platforms, for clippy's checks of them (the code must stay clean there too).
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
profile = "minimal"
